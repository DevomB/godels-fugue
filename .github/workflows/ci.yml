name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure: -DCMAKE_C_COMPILER=gcc
          - name: Linux Clang
            os: ubuntu-latest
            configure: -DCMAKE_C_COMPILER=clang
          - name: macOS Clang
            os: macos-latest
            configure: ""
          - name: Windows MSVC
            os: windows-latest
            configure: ""
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: ctest --output-on-failure
