name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            configure: -DCMAKE_C_COMPILER=gcc
          - name: Linux Clang
            os: ubuntu-latest
            configure: -DCMAKE_C_COMPILER=clang
          - name: macOS Clang
            os: macos-latest
            configure: ""
          - name: Windows MSVC
            os: windows-latest
            configure: ""
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: godels-fugue-windows
          path: build/godels-fugue.exe
          retention-days: 7

  webassembly:
    name: WebAssembly
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.11
    steps:
      - uses: actions/checkout@v7
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web
      - name: Smoke test
        run: node tests/web_smoke.mjs build-web examples
      - name: Assemble the site
        run: |
          mkdir -p _site/examples
          cp web/* build-web/godels-fugue.js build-web/godels-fugue.wasm _site/
          cp examples/*.txt examples/*.json _site/examples/
      - name: Browser test
        run: |
          npm install --no-save --no-package-lock playwright-core@1
          node tests/browser_test.mjs _site browser-artifacts
      - name: Keep the browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts
          path: browser-artifacts
          retention-days: 7

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  music:
    name: Music before and after
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build this change and the last release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target godels-fugue
          git worktree add "$RUNNER_TEMP/release" "$(git describe --tags --abbrev=0)"
          cmake -S "$RUNNER_TEMP/release" -B "$RUNNER_TEMP/release/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/release/build" --target godels-fugue
      - name: The README's examples, as this build prints them
        run: |
          build/godels-fugue --out "$RUNNER_TEMP/doc/canon.mid" --proof "$RUNNER_TEMP/doc/proof.txt" --entropy "$RUNNER_TEMP/doc/entropy.txt" || true
          build/godels-fugue --config examples/cyclic.txt --explain x8 --out "$RUNNER_TEMP/doc/canon.mid" --proof "$RUNNER_TEMP/doc/proof.txt" --entropy "$RUNNER_TEMP/doc/entropy.txt" || true
          build/godels-fugue --config examples/unsat.txt --out "$RUNNER_TEMP/doc/canon.mid" --proof "$RUNNER_TEMP/doc/proof.txt" --entropy "$RUNNER_TEMP/doc/entropy.txt" || true
          build/godels-fugue --preset longing --resolve | head -c 600 || true
      - name: Report
        run: >
          python3 tests/music_report.py "$RUNNER_TEMP/release/build/godels-fugue" build/godels-fugue music --check
          --variant seq6=w_sequence=6 --variant seq10=w_sequence=10
      - name: Keep the music for listening
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: music-before-after
          path: music
          retention-days: 14
